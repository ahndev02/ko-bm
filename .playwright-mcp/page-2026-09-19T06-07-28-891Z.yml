      - region [ref=f2e543]:
        - heading "Method" [level=2] [ref=f2e544]
        - list [ref=f2e545]:
          - listitem [ref=f2e546]:
            - strong [ref=f2e547]: "Decoding:"
            - text: deterministic settings throughout —
            - code [ref=f2e548]: "do_sample: false"
            - text: (greedy where the backend supports it;
            - code [ref=f2e549]: "temperature: 0.0"
            - text: on the API backends), with a
            - code [ref=f2e550]: "max_new_tokens: 2048"
            - text: cap. All runs share one prompt template (hash
            - code [ref=f2e551]: 39412071…
            - text: ; full hash in each evidence snapshot).
          - listitem [ref=f2e552]:
            - strong [ref=f2e553]: "Prompt:"
            - text: Korean chain-of-thought prompt, shown here exactly as sent (with
            - code [ref=f2e554]: "{question}"
            - text: "replaced by the item text):"
        - figure "System message (original Korean)" [ref=f2e555]:
          - generic [ref=f2e557]: 당신은 문제를 해결하는 전문가입니다.
        - figure "User message template (original Korean)" [ref=f2e558]:
          - generic [ref=f2e560]: "다음 문제에 대해서 충분히 생각하고 추론하여, 10개의 보기(A, B, C, D, E, F, G, H, I, J) 중 정답을 고르세요. {question} 답변은 반드시 다음 형식을 엄격히 지켜야 합니다: \"정답은 [정답 보기]입니다.\"로 끝나야하고, [정답 보기]는 A, B, C, D, E, F, G, H, I, J 중 하나여야 합니다. 정답: 문제를 풀기 위해, 한 번 천천히 생각해봅시다."
        - paragraph [ref=f2e561]:
          - strong [ref=f2e562]: "English translation (for reference only; models saw the Korean above):"
          - text: "“Think through the following problem and choose the correct answer from the 10 options (A, B, C, D, E, F, G, H, I, J). [question] Your answer must strictly keep the following form: it must end with ‘정답은 [choice]입니다.’ ([The answer is [choice].]), where [choice] is one of A–J. Answer: To solve this, let us think slowly.”"
        - list [ref=f2e563]:
          - listitem [ref=f2e564]:
            - strong [ref=f2e565]: "Answer extraction:"
            - text: strict regular expression
            - code [ref=f2e566]: 정답은\s*(.*?)\s*입니다
            - text: ; from each match, A–J letters are collected in order. The run is correct only if the extracted string is exactly the gold letter.
          - listitem [ref=f2e567]:
            - strong [ref=f2e568]: Invalid outputs count as wrong.
            - text: A missing or malformed final-answer phrase is scored 0, not excluded.
      - region [ref=f2e569]:
        - heading "Reproduce & evidence" [level=2] [ref=f2e570]
        - paragraph [ref=f2e571]: Each run directory keeps a config snapshot and a scored results file; the per-run cards above link to both. This page itself is generated from those files — raw model predictions are not published, so only the snapshot and results links below exist.
        - paragraph [ref=f2e572]: "Regenerate the data file with:"
        - generic [ref=f2e573]: python3 site/build.py
        - paragraph [ref=f2e574]:
          - text: This reads completed run directories under
          - code [ref=f2e575]: runs/
          - text: and writes
          - code [ref=f2e576]: site/results.json
          - text: plus the evidence copies under
          - code [ref=f2e577]: site/data/runs/<run>/
          - text: . Incomplete runs are skipped and listed separately.
      - region [ref=f2e578]:
        - heading "Limitations" [level=2] [ref=f2e579]
        - list [ref=f2e580]:
          - listitem [ref=f2e581]: KoBALT-700 is a public benchmark, so prior exposure of these items in model training (contamination) is unknown and cannot be ruled out.
          - listitem [ref=f2e582]: "One run per configuration: there is no measure of run-to-run repeatability, and close scores may not reflect a real difference."
          - listitem [ref=f2e583]:
            - text: The recorded dataset revision is
            - code [ref=f2e584]: 0.0.0
            - text: ", a placeholder — it is not content-addressed, so exact dataset identity rests on the benchmark release rather than a pinned hash."
          - listitem [ref=f2e585]: Reasoning policies differ across runs (provider default, explicit minimal effort, disabled); comparisons across those settings are about configuration, not models alone.
          - listitem [ref=f2e586]: "Small subgroups are noisy: several subclasses have fewer than 20 items, and single items can move those percentages by several points. Treat the domain and level tables above as descriptive."
