[project]
name = "kobalt-eval"
version = "0.1.0"
description = "KoBALT-700 benchmark evaluation harness"
readme = { text = "KoBALT-700 benchmark evaluation harness (core package).", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kobalt700" }]
dependencies = [
  "datasets",
  "pyyaml",
  "openai",
  "anthropic",
]

[project.optional-dependencies]
transformers = ["transformers", "accelerate"]
vllm = ["vllm; platform_system == 'Linux'"]
dev = ["pytest", "pytest-cov"]

[project.scripts]
kobalt-eval = "kobalt_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kobalt_eval"]
